<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上海早峰点位实时满足情况 · 2026-09-10 10:15 · 供给口径 停驻 + 调入 + 预计骑入</title>
<style>
:root{
  --brand:#00A5E3; --brand-d:#0077B6; --brand-dd:#01527E;
  --brand-l:#E6F6FD; --brand-l2:#F3FBFE; --line:#CFE9F7;
  --bg:#F1F8FC; --card:#FFFFFF;
  --ink:#0F3B52; --ink2:#547B8F; --ink3:#83A3B4;
  --ok:#0E9F6E; --ok-bg:#E7F8F1; --ok-line:#A7E3CC;
  --bad:#E0384F; --bad-bg:#FDECEE; --bad-line:#F6BFC7;
  --warn:#E08A00; --warn-bg:#FFF6E5; --warn-line:#F7DCA6;
  --grey:#7D93A0; --grey-bg:#F0F4F7; --grey-line:#DCE5EA;
  --sh:0 1px 2px rgba(6,64,92,.05),0 8px 24px rgba(6,64,92,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.6 "PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
}
a{color:var(--brand-d)}
.wrap{max-width:1720px;margin:0 auto;padding:0 20px 56px}

/* ---------------- hero ---------------- */
.hero{
  background:linear-gradient(135deg,#00B4EF 0%,#0093D6 48%,#0077B6 100%);
  color:#fff;padding:26px 0 22px;box-shadow:0 6px 22px rgba(0,119,182,.18);
}
.hero .wrap{padding-bottom:0}
.hero-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px}
.hero h1{margin:0;font-size:25px;font-weight:700;letter-spacing:.5px}
.hero .sub{font-size:13px;opacity:.92;margin-top:5px}
.hero .badge{
  margin-left:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);
  border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;backdrop-filter:blur(2px)
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
  border-radius:8px;padding:5px 11px;font-size:12px;line-height:1.5
}
.chip b{font-weight:600}

/* ---------------- section ---------------- */
.sec{margin-top:22px}
.sec-hd{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-hd h2{margin:0;font-size:17px;font-weight:700;color:var(--brand-dd)}
.sec-hd .bar{width:4px;height:17px;border-radius:2px;background:var(--brand);flex:none}
.sec-hd .note{font-size:12px;color:var(--ink3);font-weight:400}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}

/* ---------------- overview ---------------- */
/* ---- 分层总结 ---- */
.narr{padding:6px 16px 16px;font-size:13.5px;color:var(--ink)}
.nb{margin-top:14px}
.nb h4{margin:0 0 8px;font-size:14px;color:var(--brand-dd);display:flex;align-items:center;gap:7px}
.nb h4::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--brand);flex:none}
table.sm{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
table.sm thead th{position:static;font-size:12px;padding:7px 9px}
table.sm tbody td{padding:7px 9px;font-size:12.5px}
table.sm tbody tr:last-child td{border-bottom:none}
.rk{display:inline-flex;align-items:baseline;gap:5px;margin:2px 5px 2px 0;padding:3px 9px;
  border-radius:7px;font-size:12.5px;border:1px solid}
.rk b{font-weight:700}
.rk i{font-style:normal;font-size:11px;opacity:.72}
.rk.good{background:var(--ok-bg);border-color:var(--ok-line);color:#0B7A56}
.rk.bad{background:var(--bad-bg);border-color:var(--bad-line);color:#B4212F}
.narr p{margin:0 0 8px}
.narr p:last-child{margin-bottom:0}
.narr b{color:var(--brand-dd)}
.narr .hl{color:var(--bad);font-weight:600}
.narr .hl2{color:var(--ok);font-weight:600}

.ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(378px,1fr));gap:14px;margin-top:14px}
.ovgrid>*{min-width:0}      /* 网格子项默认不能小于 min-content, 会顶破容器 */
.ovcard{padding:16px 18px 18px}
.ovcard h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--brand-dd)}
.ovcard h3 .tag{
  font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;
  background:var(--brand-l);color:var(--brand-d);border:1px solid var(--line)
}
/* 用 minmax(0,1fr) 而不是 1fr: 1fr 的最小值是 min-content, 轨道无法再收缩,
   窄卡片里数字+说明文字会顶破卡片。minmax(0,...) 允许收缩, 文字自然换行。 */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--brand-l2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.kpi .k{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:25px;font-weight:700;line-height:1.25;color:var(--brand-dd);letter-spacing:-.4px}
/* 与主数值之间靠模板里的空格断行, 卡片窄时明细自动换到第二行而不顶破卡片,
   所以这里不再额外加 margin-left(否则空格 + 边距会显得太散) */
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.kpi.big{grid-column:span 1}
/* 核心指标卡: 基本满足占比 / 点位覆盖率 */
.kpi.lead{background:linear-gradient(135deg,#E4F5FE,#F5FBFE);border-color:var(--brand);
  box-shadow:inset 0 0 0 1px rgba(0,165,227,.25)}
.kpi.lead .v{font-size:29px}
.kpi .star{display:inline-block;font-size:10px;font-weight:700;vertical-align:1px;
  background:var(--brand);color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.mini div{background:#fff;border:1px dashed var(--line);border-radius:9px;padding:8px 10px}
.mini .k{font-size:11.5px;color:var(--ink3)}
.mini .v{font-size:16px;font-weight:700;color:var(--ink)}

/* ---------------- alerts ---------------- */
.algrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:12px}
.algrid>*{min-width:0}
/* 点位名/街道名可能很长且不含空格, 允许任意位置断行, 否则会顶破卡片。
   表格不加这条: 表格在 .tw/.twx 里可横向滚动, 加了反而会把字拆断。 */
.al,.hero .sub{overflow-wrap:anywhere}
.al{border-radius:12px;padding:12px 14px;border:1px solid;background:#fff;position:relative;overflow:hidden}
.al::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.al.high{border-color:var(--bad-line);background:var(--bad-bg)}
.al.high::before{background:var(--bad)}
.al.mid{border-color:var(--warn-line);background:var(--warn-bg)}
.al.mid::before{background:var(--warn)}
.al-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;padding-left:8px}
.al-lv{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;flex:none}
.al.high .al-lv{background:var(--bad)}
.al.mid .al-lv{background:var(--warn)}
.al-sc{font-size:11.5px;color:var(--ink2);background:rgba(255,255,255,.75);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.al-nm{font-weight:700;font-size:14.5px}
.al-hl{padding-left:8px;font-size:13px;font-weight:600;color:var(--ink)}
.al-dt{padding-left:8px;font-size:12px;color:var(--ink2);margin-top:5px}
.pks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-left:8px}
.pk{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:8px;
  padding:5px 8px;text-align:center}
.pk.w{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
.pk .p{display:block;font-size:11px;color:var(--ink3)}
.pk .m{display:block;font-size:16px;font-weight:700;color:var(--ink);line-height:1.35}
.pk .s{display:block;font-size:10.5px;color:var(--ink2)}
.al-empty{padding:22px;text-align:center;color:var(--ok);font-weight:600}

/* ---------------- tabs ---------------- */
.tabs{
  display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 0;padding:6px;
  background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);
  position:sticky;top:0;z-index:30
}
.tabs .grp{display:flex;gap:6px;align-items:center}
.tabs .glabel{font-size:11.5px;color:var(--ink3);padding:0 6px 0 8px;white-space:nowrap}
.tabs .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.tab{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--ink2);
  font:600 13px/1 inherit;padding:9px 15px;border-radius:9px;cursor:pointer;white-space:nowrap
}
.tab:hover{background:var(--brand-l2);color:var(--brand-d)}
.tab[aria-selected="true"]{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(0,165,227,.35)}
.tab:focus-visible{outline:2px solid var(--brand-d);outline-offset:2px}
.panel{margin-top:14px}
.panel[hidden]{display:none}

/* ---------------- toolbar ---------------- */
.tools{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--ink3);padding-left:2px}
.tools input[type=search],.tools select{
  font:13px/1 inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;min-width:118px;height:34px
}
.tools input[type=search]{min-width:220px}
.tools select:focus,.tools input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.btn{
  font:600 12.5px/1 inherit;border:1px solid var(--line);background:#fff;color:var(--brand-d);
  border-radius:8px;padding:9px 13px;cursor:pointer;height:34px
}
.btn:hover{background:var(--brand-l)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn:focus-visible{outline:2px solid var(--brand-d);outline-offset:2px}
.spacer{margin-left:auto}
.stat{display:flex;flex-wrap:wrap;gap:6px 20px;padding:10px 14px;background:var(--brand-l2);
  border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.stat b{color:var(--brand-dd);font-size:14px}

/* ---------------- table ---------------- */
.tw{overflow:auto;max-height:74vh}
/* 横向滚动容器: 表格再宽也只在容器内滚动, 不会把整个文档撑宽。
   文档一旦比视口宽, 手机浏览器会把整页缩小以显示完整宽度, 字就全变小了。 */
.twx{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.twx::-webkit-scrollbar{height:6px}
.twx::-webkit-scrollbar-thumb{background:#CFE6F5;border-radius:3px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{
  background:var(--brand-l);color:var(--brand-dd);font-weight:700;font-size:12.5px;
  text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;white-space:nowrap
}
thead tr:nth-child(2) th{top:33px}
thead th.g{text-align:center;border-left:1px solid var(--line);background:#D9F0FB}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{background:#CFEAF8}
thead th .ar{opacity:.35;margin-left:3px;font-size:10px}
thead th[aria-sort] .ar{opacity:1}
tbody td{padding:8px 10px;border-bottom:1px solid #EDF4F8;text-align:right;white-space:nowrap}
tbody tr:nth-child(even){background:#FAFDFF}
tbody tr:hover{background:var(--brand-l2)}
td.l,th.l{text-align:left}
/* 点位名称完整展示: 名称形如「静安-大宁路-工作日-早高峰-居民区-XX」,
   用省略号截断后根本分不清是哪个点位。改为换行显示, 行会变高但信息不丢。
   给列一个下限宽度, 免得表格布局把这一列压成一两个字宽。 */
td.name{min-width:210px;max-width:340px;white-space:normal;
  overflow-wrap:anywhere;line-height:1.45}
td.idx{color:var(--ink3);font-variant-numeric:tabular-nums}
td.num{font-variant-numeric:tabular-nums}
tbody tr.total{background:#EAF7FE!important;font-weight:700}
tbody tr.total td{border-bottom:2px solid var(--line)}
.gl{border-left:1px solid var(--line)}

.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;border:1px solid}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.pill.exec{color:var(--brand-d);background:var(--brand-l);border-color:var(--line)}
.pill.noexec{color:var(--grey);background:var(--grey-bg);border-color:var(--grey-line)}
.tier{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:#EEF2FF;color:#4338CA;border:1px solid #D6DCFB}
.tier.t0{background:#FFF1F2;color:#BE123C;border-color:#FBD0D6}
.tier.t1{background:#FFF7ED;color:#C2620C;border-color:#FBDDB9}
.tier.t2{background:#FEFCE8;color:#A16207;border-color:#F5E7A3}
.tier.t3{background:#EFF6FF;color:#1D4ED8;border-color:#CBDCFB}
.tier.t4{background:#F1F5F9;color:#475569;border-color:#DCE3EA}

/* ---- 核心指标高亮: 基本满足占比 / 点位覆盖率 ---- */
thead th.hero-h{background:#BFE6F8;color:#004A6E;box-shadow:inset 0 -2px 0 var(--brand-d)}
thead th.hero-h::after{content:"★";font-size:9px;margin-left:3px;color:var(--brand-d)}
td.hero-c{background:#F0F9FE;font-size:14.5px;font-weight:800;
  box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--line)}
tbody tr.total td.hero-c{background:#DFF1FC}
b.hero-i{font-size:16px}
/* ---- 指标视图切换 ---- */
.msw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px}
.msw-l{font-size:12px;color:var(--ink3)}
.msw-n{font-size:11.5px;color:var(--ink3);margin-left:auto}
.rad{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;
  color:var(--ink2);background:#fff}
.rad:hover{background:var(--brand-l2);color:var(--brand-d)}
.rad:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.rad input{accent-color:var(--brand-d);margin:0}
.rad input:focus-visible{outline:2px solid var(--brand-d);outline-offset:2px}

.r-a{color:#0B7A56;font-weight:700}
.r-b{color:#1B7FA8;font-weight:700}
.r-c{color:#B26A00;font-weight:700}
.r-d{color:#C42638;font-weight:700}
.dim{color:var(--ink3)}

.pager{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.pager .btn{padding:7px 11px;height:31px}
.pager input{width:62px;text-align:center;font:13px/1 inherit;border:1px solid var(--line);border-radius:7px;padding:7px 6px;height:31px}

.blkhd{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line);background:var(--brand-l2);border-radius:14px 14px 0 0}
.blkhd h3{margin:0;font-size:15px;color:var(--brand-dd)}
.blkhd .tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#fff;color:var(--brand-d);border:1px solid var(--line)}
.blkhd .mt{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.blkhd .mt b{color:var(--brand-dd);font-size:14px}
.blk+.blk{margin-top:16px}

details.kj{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
details.kj summary{cursor:pointer;padding:13px 16px;font-weight:700;color:var(--brand-dd);font-size:14px}
details.kj summary:focus-visible{outline:2px solid var(--brand-d);outline-offset:-2px}
details.kj .bd{padding:0 18px 16px;font-size:13px;color:var(--ink2);line-height:1.9}
details.kj code{background:var(--brand-l);color:var(--brand-dd);padding:1px 6px;border-radius:5px;font-size:12.5px}
details.kj ul{margin:6px 0;padding-left:22px}
footer{text-align:center;color:var(--ink3);font-size:12px;padding:26px 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ==================== 移动端适配 ==================== */
/* 平板 */
@media (max-width:1024px){
  .wrap{padding:0 12px 44px}
  .ovgrid{grid-template-columns:1fr}
}
/* 手机 */
@media (max-width:760px){
  body{font-size:13px}
  .wrap{padding:0 10px 40px}
  .hero{padding:16px 0 14px}
  .hero h1{font-size:17px;letter-spacing:0}
  .hero .sub{font-size:11.5px;line-height:1.5}
  .hero .badge{margin-left:0;margin-top:8px;font-size:11.5px;padding:5px 11px}
  .hero-top{gap:6px}
  .chips{gap:5px;margin-top:10px}
  .chip{font-size:10.5px;padding:4px 8px}

  .sec{margin-top:14px}
  .sec-hd{flex-wrap:wrap;gap:6px}
  .sec-hd h2{font-size:15px}
  .sec-hd .note{font-size:11px;flex:1 1 100%}

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:9px 10px}
  .kpi .v{font-size:20px}
  .kpi.lead .v{font-size:22px}
  .kpi .k{font-size:11px}
  .mini{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .ovcard{padding:12px 13px 14px}

  /* 页签横向滚动, 避免挤成好几行把内容顶下去 */
  .tabs{position:static;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding:5px;gap:4px}
  .tabs::-webkit-scrollbar{height:0}
  .tabs .grp{flex:0 0 auto}
  .tabs .glabel{display:none}
  .tab{padding:8px 11px;font-size:12px}

  /* 明细/汇总表列很多, 保持横向滑动, 但首列吸附以便始终看到点位名称 */
  .tw{max-height:none;-webkit-overflow-scrolling:touch}
  table{font-size:12px}
  thead th{padding:7px 8px;font-size:11.5px}
  tbody td{padding:7px 8px}
  td.name{min-width:150px;max-width:210px}
  #panels td.l:first-child,
  #panels th.l:first-child{position:sticky;left:0;z-index:5;
    background:#fff;box-shadow:2px 0 0 var(--line)}
  #panels thead th.l:first-child{z-index:12;background:var(--brand-l)}
  #panels tbody tr:nth-child(even) td.l:first-child{background:#FAFDFF}
  #panels tbody tr.total td.l:first-child{background:#EAF7FE}

  /* 筛选栏: 每行两个, 不再横向挤压 */
  .tools{padding:10px;gap:7px}
  .tools .fld{flex:1 1 calc(50% - 4px);min-width:0}
  .tools input[type=search],.tools select{min-width:0;width:100%;font-size:12.5px}
  .tools .fld.spacer{margin-left:0}
  .btn{padding:8px 11px;font-size:12px}
  .stat{font-size:11.5px;gap:4px 12px;padding:9px 10px}
  .stat b{font-size:12.5px}
  .pager{font-size:11.5px;gap:6px;padding:9px 10px}
  .pager .btn{padding:6px 9px}

  /* 总结区表格与标签 */
  .narr{padding:4px 10px 12px}
  table.sm thead th{font-size:11px;padding:6px 7px}
  table.sm tbody td{font-size:11.5px;padding:6px 7px}
  /* 城市总结 14 列、高价值点位 13 列, 横向滑动时把首列(时段/等级)吸附住 */
  table.sm.stick td.l:first-child{position:sticky;left:0;z-index:5;
    background:#fff;box-shadow:2px 0 0 var(--line)}
  table.sm.stick thead th.l:first-child{position:sticky;left:0;z-index:12;
    background:var(--brand-l);box-shadow:2px 0 0 var(--line)}

  return {dem, park, inb, outb, ridein, rideout, actual, eff, rate,
          ok: rate!==null && rate>=OKL,
          // 点位覆盖: 实际供给量 >= COVL 辆。用实际供给而非有效供给,
          // 后者被需求截顶, 小需求点位永远达不到阈值
          cov: actual>=COVL,
          exe: inb>=EXL};
}

/* 把匹配到的表格逐个套进 .twx 横向滚动容器。
   列数多的表格如果没有可滚动的父容器, 它的最小内容宽度会一路把
   .nb / .narr / .wrap / body 撑宽, 手机上表现为整页被缩小、字很小。
   统一在这里兜底, 比在每段模板字符串里手写 <div> 更不容易漏。 */
function wrapScroll(sel, root){
  (root || document).querySelectorAll(sel).forEach(t => {
    if(t.parentElement && t.parentElement.classList.contains('twx')) return;
    const d = document.createElement('div');
    d.className = 'twx';
    t.parentNode.insertBefore(d, t);
    d.appendChild(t);
  });
}

      if(d!=='' && x.r[F.d]!=+d) return false;
      if(l!=='' && x.r[F.l]!=+l) return false;
      if(pv!=='' && x.r[F.poi]!=+pv) return false;
      if(t!=='' && x.r[F.t]!=+t) return false;
      if(o!=='' && (x.c.ok?1:0)!=+o) return false;
      if(e!=='' && (x.c.cov?1:0)!=+e) return false;
      if(q && !(x.r[F.name].toLowerCase().includes(q) || x.r[F.id].toLowerCase().includes(q))) return false;
      return true;
    });
  }

  function draw(){
    const col = DCOLS.find(c=>c.k===st.sort);
    const rows = filtered();
    rows.sort((a,b)=>{
      const va=col.sort(a), vb=col.sort(b);
      if(typeof va==='string') return st.dir*va.localeCompare(vb,'zh-CN');
      return st.dir*(va-vb);
    });
    // 统计条
    const nn=rows.length, dem=rows.reduce((s,x)=>s+x.c.dem,0), eff=rows.reduce((s,x)=>s+x.c.eff,0);
    const ok=rows.filter(x=>x.c.ok).length, cv=rows.filter(x=>x.c.cov).length;
    $('st').innerHTML = `当前筛选：<b>${num(nn)}</b> 个点位 &nbsp;|&nbsp; 预测需求 <b>${num(dem)}</b>`
      + ` &nbsp;|&nbsp; 有效供给 <b>${num(eff)}</b> &nbsp;|&nbsp; 点位满足率 <b class="${rcls(dem?eff/dem:null)}">${pct(dem?eff/dem:null)}</b>`
      + ` &nbsp;|&nbsp; 基本满足占比 <b class="hero-i ${rcls(nn?ok/nn:null)}">${pct(nn?ok/nn:null)}</b>（${num(ok)}/${num(nn)}）`
      + ` &nbsp;|&nbsp; 点位覆盖率 <b class="hero-i ${rcls(nn?cv/nn:null)}">${pct(nn?cv/nn:null)}</b>（${num(cv)}/${num(nn)}）`;
    // 分页
    const ps = st.ps, tp = Math.max(1, Math.ceil(nn/ps));
    if(st.page>tp) st.page=tp;
    const s0=(st.page-1)*ps, page=rows.slice(s0, s0+ps);
    $('bd').innerHTML = page.map((x,i)=>{
      const r=x.r, c=x.c;
      return `<tr><td class="idx">${s0+i+1}</td>`
        + `<td class="l name" title="${esc(r[F.name])} · ID ${esc(r[F.id])}">${esc(r[F.name])}</td>`
        + `<td class="l">${esc(D.poi[r[F.poi]])}</td>`
        + `<td class="l">${esc(D.zone[r[F.z]])}</td><td class="l">${esc(D.dist[r[F.d]])}</td>`
        + `<td class="l">${esc(D.lead[r[F.l]])}</td><td class="l">${esc(D.street[r[F.s]])}</td>`
        + `<td class="l"><span class="tier t${r[F.t]}">${esc(TIERS[r[F.t]])}</span></td>`
        + `<td class="num">${num1(c.dem)}</td><td class="num">${num1(c.eff)}</td><td class="num">${num(c.actual)}</td>`
        + `<td class="num ${rcls(c.rate)}">${pct(c.rate)}</td>`
        + `<td><span class="pill ${c.ok?'ok':'bad'}">${c.ok?'基本满足':'未满足'}</span></td>`
        + `<td><span class="pill ${c.cov?'exec':'noexec'}">${c.cov?'已覆盖':'未覆盖'}</span></td>`
        // 单元格必须与 DCOLS 一一对应: DCOLS 过滤掉的列, 这里也要跳过,
        // 否则表头少一列而数据不少, 整行会错位到相邻列上
        + `<td class="num">${num(c.park)}</td>`
        + (shown('inb')     ? `<td class="num">${num(c.inb)}</td>` : '')
        + (shown('ridein')  ? `<td class="num${USE_RIDE?'':' dim'}">${num(c.ridein)}</td>` : '')
        + (shown('outb')    ? `<td class="num${USE_OUT?'':' dim'}">${num(c.outb)}</td>` : '')
        + (shown('rideout') ? `<td class="num dim">${num(c.rideout)}</td>` : '')
        + `<td class="num dim">${num(r[F.peakout])}</td></tr>`;
    }).join('') || `<tr><td colspan="${DCOLS.length}" class="l dim" style="padding:26px;text-align:center">无匹配点位</td></tr>`;
    $('pg').innerHTML = `第 <b>${st.page}</b> / ${tp} 页 &nbsp; 共 ${num(nn)} 行
      <button class="btn" data-a="first" ${st.page<=1?'disabled':''}>« 首页</button>
      <button class="btn" data-a="prev"  ${st.page<=1?'disabled':''}>‹ 上一页</button>
      <button class="btn" data-a="next"  ${st.page>=tp?'disabled':''}>下一页 ›</button>
      <button class="btn" data-a="last"  ${st.page>=tp?'disabled':''}>末页 »</button>
      <span class="spacer">跳至</span><input type="number" min="1" max="${tp}" value="${st.page}" aria-label="跳转页码" id="${uid}jp">
      <button class="btn" data-a="go">跳转</button>`;
    $('pg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.a, jp=$('jp');
      if(a==='first') st.page=1; else if(a==='prev') st.page--;
      else if(a==='next') st.page++; else if(a==='last') st.page=tp;
      else if(a==='go') st.page=Math.min(tp,Math.max(1,+jp.value||1));
      draw();
    }));
    $('hd').querySelectorAll('th.sortable').forEach(th=>{
      if(th.dataset.k===st.sort){ th.setAttribute('aria-sort', st.dir>0?'ascending':'descending');
        th.querySelector('.ar').textContent = st.dir>0?'▴':'▾'; }
      else { th.removeAttribute('aria-sort'); th.querySelector('.ar').textContent='▾'; }
    });
    window.__csv = ()=>exportCSV(rows, peak);
  }

  $('hd').addEventListener('click', e=>{
    const th = e.target.closest('th.sortable'); if(!th) return;
    const k = th.dataset.k;
    if(st.sort===k) st.dir=-st.dir; else { st.sort=k; st.dir = ['name','poi','z','d','l','s'].includes(k)?1:-1; }
    st.page=1; draw();
  });
  ['q','z','d','l','p','t','o','e'].forEach(k=>$(k).addEventListener('input',()=>{st.page=1;draw();}));
  $('ps').addEventListener('change',()=>{st.ps=+$('ps').value;st.page=1;draw();});
  $('rs').addEventListener('click',()=>{
    ['q','z','d','l','p','t','o','e'].forEach(k=>$(k).value='');
    st.page=1; draw();
  });
  $('cs').addEventListener('click',()=>window.__csv());
  draw();
}

function exportCSV(rows, peak){
  /* 导出的列与页面明细保持一致: 被隐藏的列不该出现在 CSV 里,
     否则下载下来的文件口径和页面看到的不一样。 */
  const OPT = [['inb','调入点位车辆数', x=>x.c.inb],
               ['ridein',RIDEIN_LABEL,  x=>x.c.ridein],
               ['outb','调出点位车辆数', x=>x.c.outb],
               ['rideout','骑出车辆数',  x=>x.c.rideout]].filter(o=>shown(o[0]));
  const head = ['点位名称','点位ID','POI','战区','行政区','网格组组长','街道','点位等级','预测需求量',
    '有效点位供给量','实际点位供给量','点位满足率','点位是否基本满足','点位是否已覆盖',
    '停驻车辆数', ...OPT.map(o=>o[1]),
    '历史峰值骑出车辆数'];
  const q = s => '"' + String(s).replace(/"/g,'""') + '"';
  const lines = [head.map(q).join(',')];
  rows.forEach(x=>{
    const r=x.r, c=x.c;
    lines.push([r[F.name], r[F.id], D.poi[r[F.poi]],
      D.zone[r[F.z]], D.dist[r[F.d]], D.lead[r[F.l]], D.street[r[F.s]],
      TIERS[r[F.t]], c.dem, c.eff, c.actual, c.rate===null?'':(c.rate*100).toFixed(2)+'%',
      c.ok?'基本满足':'未满足', c.cov?'已覆盖':'未覆盖',
      c.park, ...OPT.map(o=>o[2](x)), r[F.peakout]].map(q).join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `点位满足明细_${VAR.key}_${peak}_${DATA.date}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* ===================== 汇总页 ===================== */
const GRPS = [{k:'all', t:'全部点位'}].concat(TIERS.map((t,i)=>({k:t, t:t})));
/* 两套指标视图: 满足情况 / 点位覆盖。
   6 个分组 × 多个指标挤一张表会宽到不可读, 因此拆成两个视图切换,
   两边都保留完整的点位等级拆分。核心指标(基本满足占比 / 点位覆盖率)标记 hero。*/
const METSETS = {
  ok:  {label:'满足情况', mets:[
          {k:'n',   t:'点位数'},
          {k:'okr', t:'基本满足占比', hero:true},
          {k:'ok',  t:'基本满足数'},
          {k:'rate',t:'点位满足率'}]},
  cover:{label:'点位覆盖', mets:[
          {k:'n',      t:'点位数'},
          {k:'coverr', t:'点位覆盖率', hero:true},
          {k:'cover',  t:'已覆盖数'},
          {k:'uncover',t:'未覆盖数'}]},
};
const PCT_METS = new Set(['okr','rate','coverr','execr','noexecr']);

function gv(row, g, m){ return g==='all' ? row[m] : row.tiers[g][m]; }

function renderSum(pnl, dim){
  const vid = 'mv'+dim;
  pnl.innerHTML = `<div class="card msw">
      <span class="msw-l">指标视图</span>
      ${Object.entries(METSETS).map(([k,v],i)=>
        `<label class="rad"><input type="radio" name="${vid}" value="${k}" ${i?'':'checked'}>
           <span>${esc(v.label)}</span></label>`).join('')}
      <span class="msw-n">两个视图都含完整的点位等级拆分；核心指标已高亮</span>
    </div>`
    + PEAKS.map((p,i)=>{
    const uid = 'sm'+dim+i;
    const o = DATA.overview[p];
    return `<div class="blk card">
      <div class="blkhd"><h3>${p} · ${dim}维度汇总</h3>
        <span class="tag">${dim==='城市群'?'全市合计':'含全市合计行'}</span>
        <span class="mt">点位数 <b>${num(o.n)}</b>
          &nbsp; 基本满足占比 <b class="hero-i ${rcls(o.okr)}">${pct(o.okr)}</b>
          &nbsp; 点位覆盖率 <b class="hero-i ${rcls(o.coverr)}">${pct(o.coverr)}</b>（${num(o.cover)}/${num(o.n)}）</span></div>
      <div class="tw"><table><thead>
        <tr id="${uid}h1"></tr><tr id="${uid}h2"></tr></thead>
        <tbody id="${uid}b"></tbody></table></div></div>`;
  }).join('');

  const drawFns = [];
  PEAKS.forEach((p,i)=>{
    const uid = 'sm'+dim+i;
    const h1 = document.getElementById(uid+'h1'), h2 = document.getElementById(uid+'h2'),
          bd = document.getElementById(uid+'b');
    const dimTitle = dim==='城市群' ? '范围' : dim;
    const st = {g:'all', m:'okr', dir:-1, set:'ok'};
    const rows = DATA.summary[dim][p];
    const total = DATA.summary['城市群'][p][0];

    function head(){
      const METS = METSETS[st.set].mets;
      h1.innerHTML = `<th class="l" rowspan="2" scope="col">${esc(dimTitle)}</th>`
        + GRPS.map(g=>`<th class="g" colspan="${METS.length}" scope="colgroup">${esc(g.t)}</th>`).join('');
      h2.innerHTML = GRPS.map(g=>METS.map((m,j)=>
        `<th class="sortable ${j===0?'gl':''}${m.hero?' hero-h':''}" data-g="${g.k}" data-m="${m.k}"
             scope="col">${m.t}<span class="ar">▾</span></th>`
      ).join('')).join('');
    }

    function draw(){
      head();
      const METS = METSETS[st.set].mets;
      if(!METS.some(m=>m.k===st.m)) st.m = METS[1].k;   // 切换视图后回到该视图的核心指标
      const body = [...rows].sort((a,b)=>{
        const va=gv(a,st.g,st.m), vb=gv(b,st.g,st.m);
        const na = va===null||va===undefined, nb = vb===null||vb===undefined;
        if(na&&nb) return 0; if(na) return 1; if(nb) return -1;
        return st.dir*(va-vb);
      });
      const list = dim==='城市群' ? body : [Object.assign({}, total, {name:'全市合计', ctx:'', __t:1})].concat(body);
      bd.innerHTML = list.map(r=>{
        const cells = GRPS.map(({k})=>{
          const n = gv(r,k,'n');
          return METS.map((m,j)=>{
            const v = gv(r,k,m.k);
            const cls = ['num', j===0?'gl':'', m.hero?'hero-c':''];
            if(PCT_METS.has(m.k)) cls.push(rcls(m.invert ? (v===null?null:1-v) : v));
            if(m.k==='n' && !n) return `<td class="${cls.join(' ')}"><span class="dim">0</span></td>`;
            if(!n) return `<td class="${cls.join(' ')}"><span class="dim">—</span></td>`;
            return `<td class="${cls.join(' ')}">${PCT_METS.has(m.k)?pct(v):num(v)}</td>`;
          }).join('');
        }).join('');
        const nm = esc(r.name) + (r.ctx ? ` <span class="dim" style="font-size:11.5px">${esc(r.ctx)}</span>` : '');
        return `<tr class="${r.__t?'total':''}"><td class="l">${nm}</td>${cells}</tr>`;
      }).join('');
      h2.querySelectorAll('th.sortable').forEach(th=>{
        const on = th.dataset.g===st.g && th.dataset.m===st.m;
        if(on){ th.setAttribute('aria-sort', st.dir>0?'ascending':'descending');
          th.querySelector('.ar').textContent = st.dir>0?'▴':'▾'; }
        else { th.removeAttribute('aria-sort'); th.querySelector('.ar').textContent='▾'; }
      });
    }
    h2.addEventListener('click', e=>{
      const th = e.target.closest('th.sortable'); if(!th) return;
      if(st.g===th.dataset.g && st.m===th.dataset.m) st.dir=-st.dir;
      else { st.g=th.dataset.g; st.m=th.dataset.m; st.dir=-1; }
      draw();
    });
    drawFns.push(k=>{ st.set = k; st.g='all'; st.dir=-1; draw(); });
    draw();
  });

  // 指标视图切换: 三个峰段分块同步切换
  pnl.querySelectorAll(`input[name="${vid}"]`).forEach(r=>
    r.addEventListener('change', ()=>{ if(r.checked) drawFns.forEach(f=>f(r.value)); }));
}

/* ===================== 渲染全部页 ===================== */
/* 逐页隔离: 单个页签渲染异常不影响其余页签, 并在页面上显式暴露错误 */
TABDEF.forEach(t=>{
  const pnl = document.getElementById('pnl-'+t.id);
  try{
    if(t.kind==='detail') renderDetail(pnl, t.peak);
    else renderSum(pnl, t.dim);
  }catch(err){
    console.error('渲染失败:', t.label, err);
    pnl.innerHTML = `<div class="card al high" style="padding:18px">
      <div class="al-hl">该页渲染失败：${esc(t.label)}</div>
      <div class="al-dt">${esc(err && err.message ? err.message : String(err))}</div></div>`;
  }
});

  ${HIDE.size && DATA.hideNote ? `<li><b>本报告未展示的项</b>：${DATA.hideNote}</li>` : ''}

      ${PEAKS.some(p=>DATA.overview[p].neg)
