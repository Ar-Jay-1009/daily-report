<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上海调度指派报告</title>
<style>
/* ===== 哈啰浅蓝色系 ===== */
:root{
  --brand:#00AEEF; --brand-d:#0091C7; --brand-dd:#00688F; --brand-ddd:#024E6B;
  --brand-l:#E4F6FD; --brand-ll:#F2FBFE;
  --good:#12A05C; --mid:#E08A00; --bad:#D93A49;
  --ink:#1B2733; --dim:#7A8A99; --line:#D6E9F3; --bg:#F5FBFE;
  --c1:#00AEEF; --c2:#E08A00; --c3:#12A05C; --c4:#7C5CFF; --c5:#D93A49; --c6:#00897B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1560px;margin:0 auto;padding:16px}

/* ---- 头部: 深蓝渐变 + 网格光效, 科技感 ---- */
header{position:relative;overflow:hidden;color:#fff;border-radius:16px;
  padding:22px 24px;margin-bottom:14px;
  background:linear-gradient(118deg,#00AEEF 0%,#0091C7 42%,#024E6B 100%);
  box-shadow:0 8px 28px rgba(0,120,170,.28)}
header::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:30px 30px;
  mask-image:radial-gradient(120% 90% at 86% 8%,#000 10%,transparent 72%);
  -webkit-mask-image:radial-gradient(120% 90% at 86% 8%,#000 10%,transparent 72%)}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.4px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1 .dot{width:9px;height:9px;border-radius:50%;background:#7DF9A8;
  box-shadow:0 0 0 4px rgba(125,249,168,.28);flex:0 0 auto}
header .sub{margin-top:9px;font-size:13px;opacity:.96;position:relative;z-index:1}
header .chips{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
header .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);
  border-radius:20px;padding:3px 12px;font-size:12.5px;backdrop-filter:blur(2px)}
header .chip b{font-weight:800}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,90,130,.05)}
.card > h2{margin:0 0 12px;font-size:16px;font-weight:800;color:var(--brand-dd);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card > h2::before{content:"";width:4px;height:16px;border-radius:2px;
  background:var(--brand);display:inline-block}
.card > h2 .note{font-weight:500;font-size:12.5px;color:var(--dim)}
.warnbar{background:#FFF8E6;border:1px solid #F0D999;border-left:4px solid var(--mid);
  border-radius:8px;padding:9px 13px;font-size:12.5px;margin-bottom:11px}

/* ---- 一级页签 ---- */
.l1{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.l1 button{flex:1 1 260px;text-align:left;cursor:pointer;border-radius:14px;
  border:1.5px solid var(--line);background:#fff;color:var(--brand-dd);
  padding:13px 18px;font:inherit;transition:.16s;position:relative;overflow:hidden}
.l1 button .t{font-size:16px;font-weight:800;display:block}
.l1 button .s{font-size:12px;color:var(--dim);display:block;margin-top:2px}
.l1 button:hover{border-color:var(--brand);transform:translateY(-1px)}
.l1 button[aria-selected="true"]{background:linear-gradient(130deg,var(--brand),var(--brand-dd));
  border-color:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(0,174,239,.3)}
.l1 button[aria-selected="true"] .s{color:rgba(255,255,255,.88)}

/* ---- 控件 ---- */
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:11px}
.ctl .lb{font-size:12px;font-weight:700;color:var(--dim)}
.seg{display:inline-flex;border:1.5px solid var(--brand);border-radius:20px;
  overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:#fff;color:var(--brand-dd);cursor:pointer;
  font:inherit;font-size:13px;font-weight:700;padding:6px 15px;white-space:nowrap}
.seg button + button{border-left:1.5px solid var(--brand)}
.seg button[aria-selected="true"]{background:var(--brand);color:#fff}
.seg button:disabled{color:#B9CBD6;cursor:not-allowed;background:#FAFDFE}
.tabs{display:inline-flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:#fff;color:var(--brand-dd);
  border-radius:18px;padding:5px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tab:hover{border-color:var(--brand)}
.tab[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
select,input[type=search]{border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
input[type=search]{min-width:180px}
.btn{border:1.5px solid var(--brand);background:#fff;color:var(--brand-dd);
  border-radius:20px;padding:6px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--brand);color:#fff}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-dd);border-color:var(--brand-dd)}

/* ---- KPI ---- */
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.kpi{flex:1 1 210px;border:1.5px solid var(--brand);border-radius:13px;padding:13px 15px;
  background:linear-gradient(140deg,var(--brand-ll) 0%,#fff 62%);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:76px;height:76px;
  border-radius:50%;background:radial-gradient(circle,rgba(0,174,239,.16),transparent 70%)}
.kpi .k{font-size:12.5px;color:var(--brand-dd);font-weight:700}
.kpi .v{font-size:29px;font-weight:800;color:var(--brand-ddd);line-height:1.22;
  letter-spacing:-.4px}
.kpi .s{font-size:11.5px;color:var(--dim);margin-top:1px}
.kpi.alt{border-color:var(--line);background:linear-gradient(140deg,#F7FCFE,#fff 62%)}

.g{color:var(--good);font-weight:700}
.r{color:var(--bad);font-weight:700}
.m{color:var(--mid);font-weight:700}
.dimtxt{color:var(--dim);font-weight:400}
.na{color:#B9CBD6}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:10px;
  padding:1px 7px;margin-left:4px;vertical-align:1px}
.pill.up{background:#D9F2E5;color:var(--good)}
.pill.dn{background:#FBE0E4;color:var(--bad)}
.pill.fl{background:#EEF3F6;color:var(--dim)}

/* ---- 图 ---- */
.legend{display:flex;flex-wrap:wrap;gap:7px;font-size:12px;margin:2px 0 9px}
.legend button{display:inline-flex;align-items:center;gap:6px;color:var(--dim);
  background:var(--brand-ll);border:1px solid var(--line);border-radius:14px;
  padding:3px 11px 3px 8px;line-height:1.5;cursor:pointer;font:inherit;font-size:12px}
.legend button[aria-pressed="true"]{color:var(--brand-ddd);font-weight:700;
  background:#fff;border-color:var(--brand)}
.legend button[aria-pressed="false"]{opacity:.5}
.legend i{width:17px;height:3px;border-radius:2px;display:inline-block;flex:0 0 auto}
.chartbox{border:1px solid var(--line);border-radius:12px;background:#fff;
  padding:10px 8px 6px;overflow-x:auto;position:relative}
svg.chart{display:block;min-width:780px;width:100%;height:auto}
svg .axis{stroke:#C6DCE8;stroke-width:1.2}
svg .grid{stroke:#E7F3F9;stroke-width:1}
svg .lbl{fill:var(--dim);font-size:10.5px}
svg .ln{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
svg .dot{stroke:#fff;stroke-width:1.4}
svg .vline{stroke:var(--brand-d);stroke-width:1;opacity:.5}
svg .hit{fill:transparent;cursor:crosshair}
.tip{position:absolute;pointer-events:none;z-index:30;min-width:190px;
  background:#fff;border:1px solid var(--line);border-radius:9px;
  box-shadow:0 6px 22px rgba(0,80,120,.17);padding:9px 11px;font-size:12px;
  line-height:1.6;opacity:0;transition:opacity .08s}
.tip .th{font-weight:800;color:var(--brand-dd);margin-bottom:5px;
  border-bottom:1px solid var(--line);padding-bottom:4px}
.tip .row{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip .row i{width:12px;height:3px;border-radius:2px;flex:0 0 auto}
.tip .nm{flex:1 1 auto;color:var(--dim);max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ---- 表 ---- */
.tblbox{overflow:auto;max-height:600px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{background:var(--brand-l);color:var(--brand-dd);font-weight:700;
  font-size:12px;text-align:right;padding:8px 10px;white-space:nowrap;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;cursor:pointer;
  user-select:none}
thead th.grp{background:#D4EEF9;text-align:center;font-size:11.5px;top:0;z-index:11;
  cursor:default;border-left:1px solid #BFE3F3}
thead tr.h2 th{top:30px;z-index:10}
thead th:hover{background:#D0ECF8}
thead th.l{text-align:left}
thead th .ar{opacity:.35;font-size:10px;margin-left:2px}
thead th[data-on="1"]{background:var(--brand);color:#fff}
thead th[data-on="1"] .ar{opacity:1}
tbody td{padding:7px 10px;border-bottom:1px solid #EEF7FB;text-align:right;white-space:nowrap}
tbody td.l{text-align:left;font-weight:600}
tbody td.l .cx{display:block;font-weight:400;font-size:11px;color:var(--dim)}
tbody tr:hover{background:var(--brand-ll)}
tbody tr.tot{background:#EAF7FD;font-weight:800}
tbody tr.tot td{border-bottom:2px solid var(--brand);color:var(--brand-ddd)}
tbody td.sep{border-left:1px solid #E7F3F9}
.bar{height:5px;border-radius:3px;background:#E9F4F9;margin-top:4px;overflow:hidden;min-width:48px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.empty{padding:28px;text-align:center;color:var(--dim);font-size:13px}
footer{color:var(--dim);font-size:12px;text-align:center;padding:6px 0 20px;line-height:1.8}
@media(max-width:720px){
  .wrap{padding:10px}
  .kpi{flex:1 1 100%}
  header h1{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1><span class="dot"></span><span id="hTitle">上海调度指派报告</span></h1>
  <div class="sub" id="hSub"></div>
  <div class="chips" id="hChips"></div>
</header>

<div class="l1" id="l1"></div>

<div class="card">
  <h2 id="secTitle">量级总览<span class="note" id="secNote"></span></h2>
  <div class="ctl">
    <span class="lb">时间维度</span><span class="seg" id="winSeg"></span>
    <span class="lb">分析维度</span><span class="tabs" id="dimTabs"></span>
  </div>
  <div class="warnbar" id="warnBar" style="display:none"></div>
  <div class="kpis" id="kpis"></div>
</div>

<div class="card">
  <h2>指标趋势<span class="note" id="trendNote"></span></h2>
  <div class="ctl">
    <span class="lb">指标</span><span class="seg" id="metSeg"></span>
    <span class="lb">窗口</span>
    <span class="seg" id="spanSeg">
      <button data-v="14">近14天</button><button data-v="30">近30天</button
      ><button data-v="0">全部</button>
    </span>
    <button class="btn" id="btnTop">取量级TOP5</button>
    <button class="btn" id="btnClr">只看全市</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="chartbox"><svg class="chart" id="chart"></svg><div class="tip" id="tip"></div></div>
</div>

<div class="card">
  <h2 id="tblTitle">明细与排序<span class="note" id="tblNote"></span></h2>
  <div class="ctl">
    <span class="lb">指标组</span><span class="seg" id="grpSeg"></span>
    <input type="search" id="q" placeholder="搜索单元名称…">
    <select id="topN">
      <option value="0">全部行</option><option value="10">TOP10</option>
      <option value="20">TOP20</option><option value="50">TOP50</option>
    </select>
    <button class="btn pri" id="btnXls">⬇ 导出 Excel（当前表）</button>
    <button class="btn" id="btnXlsAll">⬇ 导出全部维度</button>
  </div>
  <div class="tblbox"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div class="empty" id="tblEmpty" style="display:none">当前筛选下没有数据</div>
</div>

<footer id="foot"></footer>
</div>

  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = v => v==null ? '—' : Math.round(v).toLocaleString('en-US');
const pf = (v,d) => v==null ? '—' : (v*100).toFixed(d==null?1:d)+'%';
const rf = (v,d) => v==null ? '—' : v.toFixed(d==null?2:d);

const chg = (a,b) => (a==null||b==null||!b) ? null : (a-b)/b;   /* 相对环比 */
const dif = (a,b) => (a==null||b==null) ? null : a-b;           /* 绝对差 */

/* 环比显示: 本报告所有指标「越高越好」, 升绿降红 */
function delta(v, kind){
  if(v==null) return '<span class="na">—</span>';
  const cls = Math.abs(v) < 1e-9 ? 'fl' : (v>0 ? 'up' : 'dn');
  const sg = v>0 ? '+' : (v<0 ? '−' : '');
  const a = Math.abs(v);
  let t;
  if(kind==='dn') t = sg + (a*100).toFixed(1) + '%';
  else if(kind==='dp') t = sg + (a*100).toFixed(1) + 'pp';
  else t = sg + a.toFixed(2);
  return '<span class="pill '+cls+'">'+t+'</span>';
}
function fmt(t, v, extra){
  if(t==='n') return nf(v);
  if(t==='p'){
    if(v==null) return '<span class="na">—</span>';
    const w = Math.max(0, Math.min(100, v*100));
    return '<b>'+pf(v)+'</b><div class="bar"><i style="width:'+w.toFixed(1)+'%"></i></div>';
  }
  if(t==='pp') return v==null ? '<span class="na">—</span>' : '<b>'+pf(v)+'</b>';
  if(t==='r')  return v==null ? '<span class="na">—</span>' : '<b>'+rf(v)+'</b>';
  if(t==='dn'||t==='dp'||t==='dr') return delta(v, t==='dr'?'dr':t);
  return esc(v);
}

  '1':[{k:'v',l:'总调度量',t:'n'},{k:'sr',l:'系统指派占比',t:'p'}],
  '2':[{k:'turn',l:'调度后翻台',t:'r'},{k:'ovr',l:'调度后出单率',t:'p'},{k:'v',l:'总调度量',t:'n'}]
};
const win = () => D.wins[state.pg][state.wi];

/* ===================== 取数 ===================== */
function emptyCell(){ return {v:0,s:0,o:0,c:0,src:{},scn:{}}; }
function addCell(a, b){
  if(!b) return a;
  a.v+=b.v||0; a.s+=b.s||0; a.o+=b.o||0; a.c+=b.c||0;
  for(const kk of ['src','scn']){
    const m = b[kk]||{};
    for(const k in m){
      const t = a[kk][k] || (a[kk][k]=[0,0,0,0]);
      for(let i=0;i<4;i++) t[i]+=m[k][i]||0;
    }
  }
  return a;
}
function sumAll(obj){
  const t = emptyCell();
  for(const k in obj) addCell(t, obj[k]);
  return t;
}
/* 量级类环比: 本期/基期有数据天数不同时(数据源回溯不足), 换成日均口径再比,
   否则「7天 vs 3天」会凭空跌 50%+。比率类指标(占比/翻台/出单率)不受天数影响。 */
function avgChg(a, b){
  const w = win(), cd = w.cdays||0, pd = w.pdays||0;
  if(a==null || b==null || !cd || !pd) return null;
  return chg(a/cd, b/pd);
}
const scaled = () => { const w=win(); return w.pdays>0 && w.pdays!==w.cdays; };
const dlab = () => scaled() ? '环比(日均)' : '环比';

/* 把一个单元的 cur/prev 展开成所有指标值 */
function mkVals(c, p){
  const V = {};
  const g = (o,f) => o ? f(o) : null;
  V.v = g(c,o=>o.v); V.v_d = avgChg(V.v, g(p,o=>o.v));
  V.s = g(c,o=>o.s);
  V.sr = g(c,o=>dv(o.s,o.v)); V.sr_d = dif(V.sr, g(p,o=>dv(o.s,o.v)));
  V.turn = g(c,o=>dv(o.o,o.v)); V.turn_d = dif(V.turn, g(p,o=>dv(o.o,o.v)));
  V.ovr = g(c,o=>dv(o.c,o.v)); V.ovr_d = dif(V.ovr, g(p,o=>dv(o.c,o.v)));
  const pick = (o,kk,k) => (o && o[kk] && o[kk][k]) ? o[kk][k] : null;
  D.meta.srcs.forEach(s=>{
    const a = pick(c,'src',s), b = pick(p,'src',s);
    V['sv_'+s]   = a?a[0]:null;             V['sv_'+s+'_d'] = avgChg(a&&a[0], b&&b[0]);
    V['st_'+s]   = a?dv(a[2],a[0]):null;    V['st_'+s+'_d'] = dif(V['st_'+s], b?dv(b[2],b[0]):null);
    V['so_'+s]   = a?dv(a[3],a[0]):null;    V['so_'+s+'_d'] = dif(V['so_'+s], b?dv(b[3],b[0]):null);
  });
  D.meta.scns.forEach(n=>{
    const a = pick(c,'scn',n), b = pick(p,'scn',n);
    V['nv_'+n]   = a?a[0]:null;             V['nv_'+n+'_d'] = avgChg(a&&a[0], b&&b[0]);
    V['nr_'+n]   = a?dv(a[1],a[0]):null;    V['nr_'+n+'_d'] = dif(V['nr_'+n], b?dv(b[1],b[0]):null);
  });
  return V;
}
function tableData(){
  const A = D.agg[win().key] || {};
  const cur = (A.cur||{})[state.dim] || {};
  const prv = (A.prev||{})[state.dim] || {};
  const ctx = D.ctx[state.dim] || {};
  const tc = sumAll(cur), tp = sumAll(prv);
  const rows = Object.keys(cur).map(u=>{
    const V = mkVals(cur[u], prv[u]||null);
    V.share = dv(V.v, tc.v);
    return {name:u, ctx:ctx[u]||'', V:V};
  });
  const T = mkVals(tc, tp); T.share = tc.v?1:null;
  return {rows:rows, total:{name:'合计（'+state.dim+'）', ctx:'', V:T}, tc:tc, tp:tp};
}

/* ===================== 列定义 ===================== */
function cols(){
  const pg = state.pg, grp = state.grp, G = [];
  if(pg==='1'){
    if(grp==='A') G.push({l:'', flat:[
      {k:'v',l:'总调度量',t:'n'},{k:'v_d',l:dlab(),t:'dn'},
      {k:'s',l:'系统指派量',t:'n'},
      {k:'sr',l:'系统指派占比',t:'p'},{k:'sr_d',l:'环比',t:'dp'},
      {k:'share',l:'占全市',t:'pp'}]});
    if(grp==='B') D.meta.srcs.forEach(s=>G.push({l:s, flat:[
      {k:'sv_'+s,l:'调度量',t:'n'},{k:'sv_'+s+'_d',l:dlab(),t:'dn'}]}));
    if(grp==='C') D.meta.scns.forEach(n=>G.push({l:n, flat:[
      {k:'nv_'+n,l:'调度量',t:'n'},{k:'nv_'+n+'_d',l:dlab(),t:'dn'}]}));
    if(grp==='D') D.meta.scns.forEach(n=>G.push({l:n, flat:[
      {k:'nr_'+n,l:'系统指派占比',t:'pp'},{k:'nr_'+n+'_d',l:'环比',t:'dp'}]}));
  }else{
    if(grp==='A') G.push({l:'', flat:[
      {k:'v',l:'总调度量',t:'n'},{k:'v_d',l:dlab(),t:'dn'},
      {k:'turn',l:'调度后翻台',t:'r'},{k:'turn_d',l:'环比',t:'dr'},
      {k:'ovr',l:'调度后出单率',t:'p'},{k:'ovr_d',l:'环比',t:'dp'},
      {k:'share',l:'占全市',t:'pp'}]});
    if(grp==='B') D.meta.srcs.forEach(s=>G.push({l:s, flat:[
      {k:'st_'+s,l:'翻台',t:'r'},{k:'st_'+s+'_d',l:'环比',t:'dr'}]}));
    if(grp==='C') D.meta.srcs.forEach(s=>G.push({l:s, flat:[
      {k:'so_'+s,l:'出单率',t:'pp'},{k:'so_'+s+'_d',l:'环比',t:'dp'}]}));
  }
  const flat = [];
  G.forEach(g=>g.flat.forEach((c,i)=>flat.push(Object.assign({}, c,
    {grp:g.l, first:i===0}))));
  return {groups:G, flat:flat, grouped:G.length>1 || !!G[0].l};
}

/* ===================== 渲染: KPI ===================== */
function renderKpi(){
  const t = tableData(), c = t.tc, p = t.tp, V = t.total.V;
  const box = [];
  const k = (cls,label,val,sub) => box.push(
    '<div class="kpi'+(cls?' alt':'')+'"><div class="k">'+label+'</div>'+
    '<div class="v">'+val+'</div><div class="s">'+sub+'</div></div>');
  const w = win();
  /* 基期天数与本期不一致时, 顺手把日均摆出来, 读数的人一眼知道环比是怎么来的 */
  const pnote = scaled()
    ? '上期 '+nf(p.v)+'（'+w.pdays+'天，日均 '+nf(dv(p.v,w.pdays))+'）　本期日均 '+
      nf(dv(c.v,w.cdays))
    : '上期 '+nf(p.v);
  if(state.pg==='1'){
    k(0,'总调度量', nf(c.v), '环比 '+delta(V.v_d,'dn')+'　'+pnote);
    k(0,'系统指派占比', pf(V.sr), '环比 '+delta(V.sr_d,'dp')+'　系统指派量 '+nf(c.s));
    /* 运维维度不带来源/场景拆分, 这两张卡降级为「—」而不是显示 0 */
    const top = Object.keys(c.src).length
      ? D.meta.srcs.map(s=>[s,(c.src[s]||[0])[0]]).sort((a,b)=>b[1]-a[1])[0] : null;
    k(1,'最大任务来源', top?esc(top[0]):'—',
      top? nf(top[1])+'　占 '+pf(dv(top[1],c.v)) : '该维度不提供拆分');
    const sc = Object.keys(c.scn).length
      ? D.meta.scns.map(n=>[n,(c.scn[n]||[0,0])]).sort((a,b)=>b[1][0]-a[1][0])[0] : null;
    k(1,'最大任务场景', sc?esc(sc[0]):'—',
      sc? nf(sc[1][0])+'　系统指派占比 '+pf(dv(sc[1][1],sc[1][0])) : '—');
    const n = Object.keys((D.agg[win().key].cur||{})[state.dim]||{}).length;
    k(1, state.dim+' 单元数', nf(n), '表内可排序 / 筛选 / 导出');
  }else{
    k(0,'调度后翻台', rf(V.turn), '环比 '+delta(V.turn_d,'dr')+
      '　24H出单量 '+nf(c.o));
    k(0,'调度后出单率', pf(V.ovr), '环比 '+delta(V.ovr_d,'dp')+
      '　出单车 '+nf(c.c));
    k(1,'总调度量', nf(c.v), '环比 '+delta(V.v_d,'dn')+'　'+pnote);
    const best = D.meta.srcs.map(s=>{
      const a=c.src[s]; return [s, a?dv(a[2],a[0]):null, a?a[0]:0];
    }).filter(x=>x[1]!=null && x[2]>0).sort((a,b)=>b[1]-a[1])[0];
    k(1,'翻台最高来源', best?esc(best[0]):'—',
      best? rf(best[1])+'　调度量 '+nf(best[2]) : '—');
    const worst = D.meta.srcs.map(s=>{
      const a=c.src[s]; return [s, a?dv(a[3],a[0]):null, a?a[0]:0];
    }).filter(x=>x[1]!=null && x[2]>0).sort((a,b)=>a[1]-b[1])[0];
    k(1,'出单率最低来源', worst?esc(worst[0]):'—',
      worst? pf(worst[1])+'　调度量 '+nf(worst[2]) : '—');
  }
  $('#kpis').innerHTML = box.join('');
}

/* ===================== 渲染: 表格 ===================== */
let LAST = {flat:[], rows:[], total:null};
function renderTbl(){
  const C = cols(), t = tableData();
  let rows = t.rows;
  const q = state.q.trim().toLowerCase();
  if(q) rows = rows.filter(r=>(r.name+' '+r.ctx).toLowerCase().indexOf(q)>=0);
  const sk = state.sort.k || C.flat[0].k;
  const dir = state.sort.dir;
  rows = rows.slice().sort((a,b)=>{
    const x=a.V[sk], y=b.V[sk];
    if(x==null && y==null) return a.name.localeCompare(b.name,'zh');
    if(x==null) return 1;        /* 空值恒排末尾, 不受升降序影响 */
    if(y==null) return -1;
    return (x-y)===0 ? a.name.localeCompare(b.name,'zh') : (x-y)*dir;
  });
  if(state.topN>0) rows = rows.slice(0, state.topN);
  LAST = {flat:C.flat, rows:rows, total:t.total};

  const th = [];
  if(C.grouped){
    th.push('<tr><th class="l" rowspan="2">'+esc(state.dim)+'</th>'+
      C.groups.map(g=>'<th class="grp" colspan="'+g.flat.length+'">'+
        esc(g.l||'指标')+'</th>').join('')+'</tr>');
    th.push('<tr class="h2">'+C.flat.map(c=>hcell(c, sk, dir)).join('')+'</tr>');
  }else{
    th.push('<tr><th class="l">'+esc(state.dim)+'</th>'+
      C.flat.map(c=>hcell(c, sk, dir)).join('')+'</tr>');
  }
  $('#tbl').querySelector('thead').innerHTML = th.join('');
  $('#tbl').querySelectorAll('thead th[data-k]').forEach(h=>h.onclick=()=>{
    const k=h.dataset.k;
    state.sort = (state.sort.k===k) ? {k:k, dir:-state.sort.dir} : {k:k, dir:-1};
    renderTbl();
  });

  const tr = r => '<tr'+(r.tot?' class="tot"':'')+'><td class="l">'+esc(r.name)+
    (r.ctx?'<span class="cx">'+esc(r.ctx)+'</span>':'')+'</td>'+
    C.flat.map(c=>'<td'+(c.first&&C.grouped?' class="sep"':'')+'>'+
      fmt(c.t, r.V[c.k])+'</td>').join('')+'</tr>';
  const body = [tr(Object.assign({tot:1}, t.total))].concat(rows.map(tr));
  $('#tbl').querySelector('tbody').innerHTML = body.join('');
  $('#tblEmpty').style.display = rows.length ? 'none' : '';
  $('#tblTitle').innerHTML = '明细与排序<span class="note" id="tblNote">　'+
    esc(state.dim)+' 维度 · '+rows.length+' 行 · 点击表头排序 · '+esc(win().cmp)+'</span>';
}
function hcell(c, sk, dir){
  const on = c.k===sk;
  return '<th data-k="'+c.k+'"'+(on?' data-on="1"':'')+'>'+esc(c.l)+
    '<span class="ar">'+(on?(dir<0?'▼':'▲'):'↕')+'</span></th>';
}

/* ===================== 趋势图 ===================== */
function unitSeries(dim, unit){
  if(unit===CITY){
    const m = D.series['城市群'] || {}, acc = {};
    for(const u in m) m[u].forEach(r=>{
      const a = acc[r[0]] || (acc[r[0]]=[r[0],0,0,0,0]);
      for(let i=1;i<5;i++) a[i]+=r[i];
    });
    return Object.values(acc).sort((a,b)=>a[0]-b[0]);
  }
  return (D.series[dim]||{})[unit] || [];
}
function metVal(r){
  if(state.met==='v') return r[1];
  if(state.met==='sr') return dv(r[2], r[1]);
  if(state.met==='turn') return dv(r[3], r[1]);
  if(state.met==='ovr') return dv(r[4], r[1]);
  return null;
}
function unitRank(){
  const A = (D.agg[win().key].cur||{})[state.dim] || {};
  const avail = new Set(Object.keys(D.series[state.dim]||{}));
  return Object.keys(A).filter(u=>avail.has(u))
    .sort((a,b)=>A[b].v-A[a].v);
}
/* 城市群维度下「全市」就是它自己, 再加一条基准线只会完全重叠, 所以不加 */
const isCityDim = () => state.dim === '城市群';
function pickTop(){
  state.units = new Set(isCityDim() ? [] : [CITY]);
  unitRank().slice(0, isCityDim()?6:4).forEach(u=>state.units.add(u));
}
function renderLegend(){
  const rank = unitRank();
  const all = (isCityDim() ? [] : [CITY]).concat(rank);
  /* 已选但不在候选里的(比如在城市群维度点了「只看全市」)也要显示, 否则线在图上却没图例 */
  [...state.units].forEach(u=>{ if(all.indexOf(u)<0) all.unshift(u); });
  const idx = {}; [...state.units].forEach((u,i)=>idx[u]=i);
  $('#legend').innerHTML = all.map(u=>{
    const on = state.units.has(u);
    const c = on ? CO[idx[u] % CO.length] : '#C9D8E1';
    return '<button data-u="'+esc(u)+'" aria-pressed="'+on+'">'+
      '<i style="background:'+c+'"></i>'+esc(u)+'</button>';
  }).join('');
  $('#legend').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const u=b.dataset.u;
    if(state.units.has(u)) state.units.delete(u);
    else { if(state.units.size>=6){ alert('最多同时对比 6 条线'); return; }
           state.units.add(u); }
    renderLegend(); drawChart();
  });
}
function drawChart(){
  renderLegend();
  /* 两页的指标集不同(第一页量级/占比, 第二页翻台/出单率), 跨页切换时
     残留的 state.met 可能不属于当前页, 这里兜底回落到该页第一个指标 */
  let met = METS[state.pg].find(m=>m.k===state.met);
  if(!met){ met = METS[state.pg][0]; state.met = met.k; }
  let dates = D.dates.slice();
  if(state.span>0) dates = dates.slice(-state.span);
  const di0 = D.dates.length - dates.length;
  const units = [...state.units];
  const lines = units.map((u,i)=>{
    const map = {};
    unitSeries(state.dim,u).forEach(r=>{ map[r[0]] = metVal(r); });
    return {name:u, color:CO[i%CO.length],
            pts: dates.map((d,j)=>{ const v=map[di0+j];
              return (v==null||isNaN(v))?null:v; })};
  });
  const vals = lines.flatMap(l=>l.pts).filter(v=>v!=null);
  const W=1180, H=320, L=62, R=16, T=16, B=42;
  const svg = $('#chart'); svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if(!vals.length || !dates.length){
    svg.innerHTML = '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" class="lbl">暂无趋势数据</text>';
    return;
  }
  let mx = Math.max(...vals), mn = Math.min(...vals);
  if(met.t==='n'){ mn = 0; }
  else { const pad=(mx-mn)*0.18 || mx*0.1 || 0.05; mn=Math.max(0,mn-pad); mx=mx+pad; }
  /* 占比类指标天然封顶 100%, 留白不能把轴顶到 118% 这种不存在的刻度 */
  if(met.t==='p') mx = Math.min(mx, 1);
  if(mx<=mn) mx = mn + (Math.abs(mn)||1)*0.1;
  const px = i => L + (W-L-R) * (dates.length===1?0.5:i/(dates.length-1));
  const py = v => T + (H-T-B) * (1 - (v-mn)/(mx-mn));
  const fy = v => met.t==='n' ? (v>=10000? (v/10000).toFixed(1)+'万' : nf(v))
                 : (met.t==='p' ? pf(v,0) : rf(v,1));
  const o = [];
  for(let i=0;i<=4;i++){
    const v = mn + (mx-mn)*i/4, y = py(v);
    o.push('<line class="grid" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+
      '" y2="'+y.toFixed(1)+'"/>');
    o.push('<text class="lbl" x="'+(L-7)+'" y="'+(y+3.5).toFixed(1)+
      '" text-anchor="end">'+fy(v)+'</text>');
  }
  o.push('<line class="axis" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/>');
  const step = Math.ceil(dates.length/14);
  dates.forEach((d,i)=>{ if(i%step) return;
    o.push('<text class="lbl" x="'+px(i).toFixed(1)+'" y="'+(H-B+16)+
      '" text-anchor="middle">'+d.slice(5)+'</text>'); });
  lines.forEach(l=>{
    let seg=[], out=[];
    l.pts.forEach((v,i)=>{ if(v==null){ if(seg.length>1) out.push(seg); seg=[]; }
      else seg.push(px(i).toFixed(1)+','+py(v).toFixed(1)); });
    if(seg.length>1) out.push(seg);
    out.forEach(s=>o.push('<polyline class="ln" stroke="'+l.color+'" points="'+
      s.join(' ')+'"/>'));
    l.pts.forEach((v,i)=>{ if(v==null) return;
      const single = (i===0||l.pts[i-1]==null) && (i===l.pts.length-1||l.pts[i+1]==null);
      if(single || dates.length<=31)
        o.push('<circle class="dot" cx="'+px(i).toFixed(1)+'" cy="'+py(v).toFixed(1)+
          '" r="'+(single?3.2:2.4)+'" fill="'+l.color+'"/>'); });
  });
  o.push('<line class="vline" id="vl" x1="0" y1="'+T+'" x2="0" y2="'+(H-B)+
    '" style="display:none"/>');
  o.push('<rect class="hit" id="hit" x="'+L+'" y="'+T+'" width="'+(W-L-R)+
    '" height="'+(H-T-B)+'"/>');
  svg.innerHTML = o.join('');

  const tip = $('#tip'), vl = svg.querySelector('#vl');
  const hit = svg.querySelector('#hit');
  hit.onmousemove = e=>{
    const br = svg.getBoundingClientRect();
    const sx = (e.clientX - br.left) / br.width * W;
    let i = Math.round((sx - L) / ((W-L-R) || 1) * (dates.length-1));
    i = Math.max(0, Math.min(dates.length-1, i));
    vl.setAttribute('x1', px(i)); vl.setAttribute('x2', px(i));
    vl.style.display='';
    const rowsH = lines.map(l=>'<div class="row"><i style="background:'+l.color+
      '"></i><span class="nm">'+esc(l.name)+'</span><b>'+
      (l.pts[i]==null?'—':(met.t==='n'?nf(l.pts[i]):(met.t==='p'?pf(l.pts[i]):rf(l.pts[i]))))+
      '</b></div>').join('');
    tip.innerHTML = '<div class="th">'+dates[i]+'　'+met.l+'</div>'+rowsH;
    tip.style.opacity=1;
    const bx = px(i)/W*br.width;
    tip.style.left = Math.max(4, Math.min(br.width-215, bx+14))+'px';
    tip.style.top = '14px';
  };
  hit.onmouseleave = ()=>{ tip.style.opacity=0; vl.style.display='none'; };
}

/* ===================== 导出 Excel (SpreadsheetML, 无需外部库) ===================== */
function xe(s){ return String(s==null?'':s).replace(/[&<>]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function sheetXml(name, header, rows){
  const cell = v => (v==null || v==='') ? '<Cell/>'
    : (typeof v==='number' && isFinite(v)
       ? '<Cell><Data ss:Type="Number">'+v+'</Data></Cell>'
       : '<Cell><Data ss:Type="String">'+xe(v)+'</Data></Cell>');
  const nm = String(name).replace(/[\\\/\?\*\[\]:]/g,'_').slice(0,31);
  return '<Worksheet ss:Name="'+xe(nm)+'"><Table>'+
    '<Row>'+header.map(h=>'<Cell ss:StyleID="h"><Data ss:Type="String">'+
      xe(h)+'</Data></Cell>').join('')+'</Row>'+
    rows.map(r=>'<Row>'+r.map(cell).join('')+'</Row>').join('')+
    '</Table></Worksheet>';
}
function download(fname, sheets){
  const xml = '<?xml version="1.0" encoding="UTF-8"?>'+
    '<?mso-application progid="Excel.Sheet"?>'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"'+
    ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/>'+
    '<Interior ss:Color="#00AEEF" ss:Pattern="Solid"/></Style></Styles>'+
    sheets.map(s=>sheetXml(s.name, s.header, s.rows)).join('')+'</Workbook>';
  const b = new Blob(['\ufeff'+xml], {type:'application/vnd.ms-excel;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
/* 导出用表头带单位后缀, 避免 Excel 里看不出是比例还是绝对值 */
function hdr(c){
  const u = {n:'', p:'(比例)', pp:'(比例)', r:'', dn:'(环比%)',
             dp:'(环比·百分点)', dr:'(环比·绝对值)'}[c.t] || '';
  return (c.grp ? c.grp+'·' : '') + c.l + u;
}
function sheetOf(dim, grp){
  const sv = state.dim, sg = state.grp;
  state.dim = dim; state.grp = grp;
  const C = cols(), t = tableData();
  const rows = t.rows.slice().sort((a,b)=>(b.V.v||0)-(a.V.v||0));
  const header = [dim, '说明'].concat(C.flat.map(hdr));
  const body = [[ '合计', ''].concat(C.flat.map(c=>t.total.V[c.k]))]
    .concat(rows.map(r=>[r.name, r.ctx].concat(C.flat.map(c=>r.V[c.k]))));
  state.dim = sv; state.grp = sg;
  return {name:dim+'-'+GRPS[state.pg].find(g=>g.k===grp).l, header:header, rows:body};
}
function metaSheet(){
  const m = D.meta, w = win();
  return {name:'口径说明', header:['项目','内容'], rows:[
    ['报告', PAGES.find(p=>p.k===state.pg).title],
    ['时间维度', w.label], ['统计区间', w.range[0]+' ~ '+w.range[1]],
    ['环比口径', w.cmp], ['环比基期', w.prange[0]+' ~ '+w.prange[1]],
    ['任务大类口径', m.bigs.join(' / ')], ['任务场景口径', m.scns.join(' / ')],
    ['维度归属', '按「调入网格」匹配网格分区表'],
    ['网格匹配率(调度量加权)', m.matchRate],
    ['系统指派占比', '任务来源「'+m.sysSrc+'」车辆计数 ÷ 总调度量'],
    ['调度后翻台', '调度后24H出单量 ÷ 调度量'],
    ['调度后出单率', '调度后24H出单车数 ÷ 调度量'],
    ['数据日期范围', m.dataMin+' ~ '+m.dataMax],
    ['T-1 / T-2', m.t1+' / '+m.t2], ['生成时间', m.genAt]
  ]};
}
function expOne(){
  const g = GRPS[state.pg].find(x=>x.k===state.grp).l;
  download('上海调度指派报告_'+PAGES.find(p=>p.k===state.pg).title+'_'+state.dim+
    '_'+g+'_'+D.meta.t1+'.xls', [sheetOf(state.dim, state.grp), metaSheet()]);
}
function expAll(){
  const sheets = [metaSheet()];
  D.dims.forEach(d=>GRPS[state.pg].forEach(g=>{
    if(d==='运维' && g.k!=='A') return;
    sheets.push(sheetOf(d, g.k));
  }));
  download('上海调度指派报告_'+PAGES.find(p=>p.k===state.pg).title+'_全维度_'+
    D.meta.t1+'.xls', sheets);
}

/* ===================== 初始化 ===================== */
function renderAll(){
  /* 先把跨页残留的状态归一, 保证指标按钮高亮与图上画的是同一个指标 */
  if(!METS[state.pg].some(m=>m.k===state.met)) state.met = METS[state.pg][0].k;
  if(!GRPS[state.pg].some(g=>g.k===state.grp)) state.grp = 'A';
  if(state.dim==='运维' && state.grp!=='A') state.grp = 'A';
  if(state.wi >= D.wins[state.pg].length) state.wi = 0;
  /* 切维度后, 上一维度的单元在新维度里不存在, 留着会让图例空着却没有线 */
  const ok = D.series[state.dim] || {};
  [...state.units].forEach(u=>{ if(u!==CITY && !(u in ok)) state.units.delete(u); });
  if(!state.units.size) pickTop();
  renderCtl(); renderKpi(); renderTbl(); drawChart();
}
$('#q').oninput = e=>{ state.q=e.target.value; renderTbl(); };
$('#topN').onchange = e=>{ state.topN=+e.target.value; renderTbl(); };
$('#btnXls').onclick = expOne;
$('#btnXlsAll').onclick = expAll;
$('#btnTop').onclick = ()=>{ pickTop(); drawChart(); };
$('#btnClr').onclick = ()=>{ state.units=new Set([CITY]); drawChart(); };
window.addEventListener('resize', ()=>{ $('#tip').style.opacity=0; });
renderHead();
state.met = METS[state.pg][0].k;
pickTop();
renderAll();
</script>
